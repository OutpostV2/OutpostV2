[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "outpost-backend"
version = "0.1.0"
description = "Outpost backend foundation"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.20,<2",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.141.1,<1",
  "phonenumbers>=9.0.39,<10",
  "psycopg[binary]>=3.3.5,<4",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.15,<3",
  "PyJWT[crypto]>=2.12.1,<3",
  "redis>=8.1,<9",
  "sqlalchemy>=2.0.54,<2.1",
  "uvicorn[standard]>=0.53,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2,<2",
  "httpx2>=2.13,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "integration: requires the local infrastructure named by the test",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["phonenumbers", "phonenumbers.*"]
follow_imports = "skip"
